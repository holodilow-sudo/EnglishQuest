name: Build APK

on:
  push:
    branches: [main]
    paths: ['app/**', 'android/**', 'scripts/build-android.py', 'scripts/validate-content.cjs', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['app/**', 'android/**', 'scripts/build-android.py', 'scripts/validate-content.cjs', '.github/workflows/build-apk.yml']
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign APK and prepare a draft release (main only; never publishes)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: apk-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate course
        run: node scripts/validate-content.cjs
      - name: Build unsigned APK without secrets
        run: |
          $env:ENGLISHQUEST_JDK = $env:JAVA_HOME_17_X64
          $env:ENGLISHQUEST_BUILD_TOOLS = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
          $env:ENGLISHQUEST_ANDROID_JAR = Join-Path $env:ANDROID_HOME 'platforms/android-35/android.jar'
          python scripts/build-android.py --unsigned --allow-system-city-speech --allow-system-travel-speech
          if ($LASTEXITCODE -ne 0) { throw 'APK build failed' }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unsigned-apk-${{ github.run_number }}
          path: |
            dist/*-unsigned.apk
            dist/*-unsigned.apk.sha256
            dist/build-info.json
          if-no-files-found: error
          retention-days: 7

  sign:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/main' && github.repository == 'holodilow-sudo/EnglishQuest'
    environment: android-signing
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: unsigned-apk-${{ github.run_number }}
          path: unsigned
      - name: Sign with existing private key and verify update compatibility
        env:
          KEYSTORE_BASE64: ${{ secrets.ENGLISHQUEST_KEYSTORE_BASE64 }}
          ENGLISHQUEST_STORE_PASSWORD: ${{ secrets.ENGLISHQUEST_STORE_PASSWORD }}
          ENGLISHQUEST_KEY_PASSWORD: ${{ secrets.ENGLISHQUEST_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:KEYSTORE_BASE64 -or -not $env:ENGLISHQUEST_STORE_PASSWORD) { throw 'Configure private signing secrets in the android-signing environment first' }
          if (-not $env:ENGLISHQUEST_KEY_PASSWORD) { $env:ENGLISHQUEST_KEY_PASSWORD = $env:ENGLISHQUEST_STORE_PASSWORD }
          $keyPath = Join-Path $env:RUNNER_TEMP 'englishquest-signing.keystore'
          try {
            [IO.File]::WriteAllBytes($keyPath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            $env:KEYSTORE_BASE64 = $null
            $java = Join-Path $env:JAVA_HOME_17_X64 'bin/java.exe'
            $sdkTools = Join-Path $env:ANDROID_HOME 'build-tools/35.0.0'
            $signer = Join-Path $sdkTools 'lib/apksigner.jar'
            $metadata = Get-Content unsigned/build-info.json -Raw | ConvertFrom-Json
            if ($metadata.version -notmatch '^\d+\.\d+\.\d+$' -or $metadata.package -ne 'ru.arseniy.englishquest') { throw 'Unexpected package metadata' }
            $inputs = @(Get-ChildItem unsigned -Filter '*-unsigned.apk')
            if ($inputs.Count -ne 1) { throw 'Expected exactly one unsigned APK' }
            $inputApk = $inputs[0].FullName
            if ((Get-FileHash $inputApk -Algorithm SHA256).Hash.ToLowerInvariant() -ne $metadata.sha256) { throw 'Unsigned APK checksum mismatch' }
            $badging = & "$sdkTools/aapt2.exe" dump badging $inputApk
            if ($LASTEXITCODE -ne 0) { throw 'Cannot read Android manifest' }
            if ($badging[0] -notmatch "name='ru\.arseniy\.englishquest' versionCode='(\d+)' versionName='([^']+)'") { throw 'Unexpected Android package' }
            if ([int]$Matches[1] -ne $metadata.versionCode -or $Matches[2] -ne $metadata.version) { throw 'Manifest version mismatch' }
            if ($badging -match '^application-debuggable') { throw 'Refusing to sign a debug build' }
            New-Item -ItemType Directory signed | Out-Null
            $name = "EnglishQuest-$($metadata.version).apk"
            $outputApk = Join-Path 'signed' $name
            & $java -jar $signer sign --ks $keyPath --ks-key-alias englishquesttest --ks-pass env:ENGLISHQUEST_STORE_PASSWORD --key-pass env:ENGLISHQUEST_KEY_PASSWORD --out $outputApk $inputApk
            if ($LASTEXITCODE -ne 0) { throw 'Signing failed' }
            $verification = & $java -jar $signer verify --verbose --print-certs $outputApk
            if ($LASTEXITCODE -ne 0) { throw 'Signature verification failed' }
            $expected = '78675df290e5190b39be40c609fffc3060e0b754462a2cbfd2172cf35c9ad246'
            if (-not ($verification -match "Signer #1 certificate SHA-256 digest: $expected")) { throw 'Signing certificate differs from installed app' }
            & "$sdkTools/zipalign.exe" -c 4 $outputApk
            if ($LASTEXITCODE -ne 0) { throw 'APK alignment check failed' }
            $metadata.apk = $name
            $metadata.bytes = (Get-Item $outputApk).Length
            $metadata.sha256 = (Get-FileHash $outputApk -Algorithm SHA256).Hash.ToLowerInvariant()
            $metadata.signed = $true
            $metadata.variant = 'github-release'
            $metadata | Add-Member -NotePropertyName signingCertificateSha256 -NotePropertyValue $expected
            $metadata | Add-Member -NotePropertyName sourceCommit -NotePropertyValue $env:GITHUB_SHA
            $metadata | ConvertTo-Json -Depth 20 | Set-Content signed/build-info.json -Encoding utf8
            "$($metadata.sha256)  $name" | Set-Content "$outputApk.sha256" -Encoding ascii
            "### Signed APK ready`nCertificate matches previous releases. No release was published." >> $env:GITHUB_STEP_SUMMARY
          } finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
            $env:KEYSTORE_BASE64 = $null
            $env:ENGLISHQUEST_STORE_PASSWORD = $null
            $env:ENGLISHQUEST_KEY_PASSWORD = $null
          }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installable-apk-${{ github.run_number }}
          path: |
            signed/*.apk
            signed/*.sha256
            signed/build-info.json
          if-no-files-found: error
          retention-days: 30

  draft-release:
    needs: sign
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref == 'refs/heads/main' && github.repository == 'holodilow-sudo/EnglishQuest'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: installable-apk-${{ github.run_number }}
          path: signed
      - name: Prepare draft only; never publish or replace a published release
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import hashlib, json, os, pathlib, re, urllib.error, urllib.parse, urllib.request

          repo = 'holodilow-sudo/EnglishQuest'
          api = 'https://api.github.com/repos/' + repo
          token = os.environ['GH_TOKEN']
          def request(url, method='GET', payload=None, binary=False):
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/vnd.github+json',
                         'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'EnglishQuest-draft-release'}
              data = payload if binary else (json.dumps(payload).encode() if payload is not None else None)
              if data is not None:
                  headers['Content-Type'] = 'application/octet-stream' if binary else 'application/json'
              with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers, method=method), timeout=120) as response:
                  return json.load(response)

          def summary(message):
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as stream:
                  stream.write(message + '\n')

          def prepare():
              folder = pathlib.Path('signed')
              meta = json.loads((folder / 'build-info.json').read_text(encoding='utf-8-sig'))
              version = meta['version']
              if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                  raise RuntimeError('Invalid release version')
              name = 'EnglishQuest-' + version + '.apk'
              cert = '78675df290e5190b39be40c609fffc3060e0b754462a2cbfd2172cf35c9ad246'
              if (meta.get('apk') != name or meta.get('package') != 'ru.arseniy.englishquest'
                      or meta.get('signed') is not True or meta.get('signingCertificateSha256') != cert
                      or meta.get('sourceCommit') != os.environ['GITHUB_SHA']):
                  raise RuntimeError('Untrusted signed build metadata')
              files = {name: (folder / name).read_bytes(), name + '.sha256': (folder / (name + '.sha256')).read_bytes(),
                       'build-info.json': (folder / 'build-info.json').read_bytes()}
              digest = hashlib.sha256(files[name]).hexdigest()
              if digest != meta['sha256'] or files[name + '.sha256'].decode().strip() != digest + '  ' + name:
                  raise RuntimeError('Signed APK checksum mismatch')
              releases = []
              page = 1
              while True:
                  batch = request(api + '/releases?per_page=100&page=' + str(page))
                  releases.extend(batch)
                  if len(batch) < 100:
                      break
                  page += 1
              tag = 'v' + version
              existing = next((item for item in releases if item['tag_name'] == tag), None)
              if existing and not existing['draft']:
                  summary('### Draft skipped\nVersion ' + tag + ' is already published. Its files were not changed. Increase versionName and versionCode for the next release.')
                  return
              stable = [item for item in releases if not item['draft'] and not item['prerelease'] and re.fullmatch(r'v\d+\.\d+\.\d+', item['tag_name'])]
              semver = lambda value: tuple(map(int, value.lstrip('v').split('.')))
              if stable:
                  latest = max(stable, key=lambda item: semver(item['tag_name']))
                  if semver(version) <= semver(latest['tag_name']):
                      raise RuntimeError('Release version must be newer than published versions')
                  info_asset = next((asset for asset in latest['assets'] if asset['name'] == 'build-info.json'), None)
                  if info_asset:
                      # Published metadata is public; no token is sent to download redirects.
                      with urllib.request.urlopen(info_asset['browser_download_url'], timeout=120) as response:
                          previous_code = json.loads(response.read().decode('utf-8-sig'))['versionCode']
                  elif latest['tag_name'] == 'v1.2.2':
                      previous_code = 6
                  else:
                      raise RuntimeError('Published release needs build-info.json to verify versionCode')
                  if type(meta['versionCode']) is not int or meta['versionCode'] <= previous_code:
                      raise RuntimeError('versionCode must be greater than the latest published APK')
              if existing and existing['target_commitish'] != os.environ['GITHUB_SHA']:
                  raise RuntimeError('A draft for this version already exists from a different commit; review it before replacing anything')
              release = existing or request(api + '/releases', 'POST', {
                  'tag_name': tag, 'target_commitish': os.environ['GITHUB_SHA'],
                  'name': 'EnglishQuest ' + version, 'draft': True, 'prerelease': False,
                  'body': 'Черновик для согласования. Публиковать только после одобрения владельца.\n\n'
                          + 'APK подписана прежним ключом; пакет приложения сохранён. Устанавливайте поверх предыдущей версии без удаления данных.\n\n'
                          + 'Версия: ' + version + ' (versionCode ' + str(meta['versionCode']) + ').\n'
                          + 'Сборка: https://github.com/' + repo + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
                          + 'Коммит: ' + os.environ['GITHUB_SHA'] + '\n\nПеред публикацией проверьте APK и дополните описание изменениями.'})
              release_url = api + '/releases/' + str(release['id'])
              for filename, data in files.items():
                  current = request(release_url)
                  if not current['draft']:
                      raise RuntimeError('Release is no longer a draft; stopping without changes')
                  asset = next((item for item in current['assets'] if item['name'] == filename), None)
                  expected_digest = 'sha256:' + hashlib.sha256(data).hexdigest()
                  if asset:
                      if asset.get('digest') != expected_digest:
                          raise RuntimeError('Draft asset differs; refusing to overwrite ' + filename)
                  else:
                      uploaded = request('https://uploads.github.com/repos/' + repo + '/releases/' + str(release['id'])
                                         + '/assets?name=' + urllib.parse.quote(filename, safe=''), 'POST', data, binary=True)
                      if uploaded.get('digest') != expected_digest:
                          raise RuntimeError('Uploaded asset checksum mismatch')
              final = request(release_url)
              if not final['draft'] or not set(files).issubset({item['name'] for item in final['assets']}):
                  raise RuntimeError('Draft verification failed')
              summary('### Draft ready for approval\n[' + tag + '](' + final['html_url'] + ') contains the APK, SHA-256 and build metadata. Nothing was published.')

          prepare()
